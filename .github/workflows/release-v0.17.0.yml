name: Release Dayline v0.17.0.beta

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-v0.17.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.17.0.beta
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 1
          fi

      - name: Verify Nothing SDK binary is not committed
        run: test ! -f app/libs/glyph-matrix-sdk-2.0.aar

      - name: Static release validation
        run: python3 scripts/validate_release.py

      - name: Fetch official Nothing Glyph Matrix SDK
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar \
            -o app/libs/glyph-matrix-sdk-2.0.aar
          test -s app/libs/glyph-matrix-sdk-2.0.aar

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 / API 37 SDK
        run: sdkmanager --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Run recurrence and planning unit tests
        run: gradle :app:testBetaDebugUnitTest :app:testPlayDebugUnitTest --no-daemon --stacktrace

      - name: Compile beta and Play debug variants
        run: gradle :app:assembleBetaDebug :app:assemblePlayDebug --no-daemon --stacktrace

      - name: Validate beta signing secrets
        env:
          KEYSTORE: ${{ secrets.DAYLINE_BETA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DAYLINE_BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYLINE_BETA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYLINE_BETA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore beta keystore
        env:
          KEYSTORE: ${{ secrets.DAYLINE_BETA_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dayline-beta.jks"

      - name: Verify beta keystore alias
        env:
          STORE_PASSWORD: ${{ secrets.DAYLINE_BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYLINE_BETA_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/dayline-beta.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed beta APK
        env:
          DAYLINE_KEYSTORE_FILE: ${{ runner.temp }}/dayline-beta.jks
          DAYLINE_KEYSTORE_PASSWORD: ${{ secrets.DAYLINE_BETA_KEYSTORE_PASSWORD }}
          DAYLINE_KEY_ALIAS: ${{ secrets.DAYLINE_BETA_KEY_ALIAS }}
          DAYLINE_KEY_PASSWORD: ${{ secrets.DAYLINE_BETA_KEY_PASSWORD }}
        run: gradle :app:assembleBetaRelease --no-daemon --stacktrace

      - name: Verify beta APK version
        shell: bash
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          BADGING="$($AAPT dump badging app/build/outputs/apk/beta/release/app-beta-release.apk | head -n 1)"
          python3 - "$RELEASE_TAG" "$BADGING" <<'PY'
          import re
          import sys

          tag = sys.argv[1].removeprefix("v")
          badging = sys.argv[2]
          match = re.search(r"versionCode='(\d+)'.*versionName='([^']+)'", badging)
          if not match:
              raise SystemExit("Could not read APK versionCode/versionName")
          code = int(match.group(1))
          name = match.group(2)
          if name != tag:
              raise SystemExit(f"Tag/APK versionName mismatch: tag={tag}, apk={name}")
          numbers = re.match(r"^(\d+)\.(\d+)\.(\d+)", tag)
          if not numbers:
              raise SystemExit(f"Unsupported beta tag format: {tag}")
          major, minor, patch = map(int, numbers.groups())
          expected = major * 1_000_000 + minor * 100 + patch
          if code != expected:
              raise SystemExit(f"Tag/APK versionCode mismatch: expected={expected}, apk={code}")
          print(f"Verified {name} / versionCode {code}")
          PY

      - name: Verify beta APK signature
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/beta/release/app-beta-release.apk

      - name: Validate beta release notes
        run: |
          NOTES_FILE="docs/releases/$RELEASE_TAG.md"
          test -s "$NOTES_FILE"
          grep -qi '^## Added' "$NOTES_FILE"
          grep -qi '^## Changed' "$NOTES_FILE"
          grep -qi '^## Fixed' "$NOTES_FILE"

      - name: Prepare beta APK and checksum
        id: beta
        run: |
          APK_NAME="dayline-$RELEASE_TAG.apk"
          cp app/build/outputs/apk/beta/release/app-beta-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "${{ steps.beta.outputs.apk }}" \
            "${{ steps.beta.outputs.apk }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dayline $RELEASE_TAG" \
            --prerelease \
            --notes-file "docs/releases/$RELEASE_TAG.md"
