name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  # Each branch/tag gets its own lane. A newer run on the same ref supersedes
  # an older one; different beta tags never cancel one another.
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require beta bump after functional changes
        run: python3 scripts/check_beta_bump.py

      - name: Verify Nothing SDK binary is not committed
        run: test ! -f app/libs/glyph-matrix-sdk-2.0.aar

      - name: Test beta version tooling
        run: python3 -m unittest scripts.test_bump_beta

      - name: Test beta bump guard
        run: python3 -m unittest scripts.test_check_beta_bump

      - name: Static release validation
        run: python3 scripts/validate_release.py

      - name: Fetch official Nothing Glyph Matrix SDK
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar \
            -o app/libs/glyph-matrix-sdk-2.0.aar
          test -s app/libs/glyph-matrix-sdk-2.0.aar

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 / API 37 SDK
        run: sdkmanager --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Run JVM regression tests
        run: gradle :app:testBetaDebugUnitTest :app:testPlayDebugUnitTest --no-daemon --stacktrace

      - name: Compile beta and Play debug variants
        run: gradle :app:assembleBetaDebug :app:assemblePlayDebug --no-daemon --stacktrace

      - name: Upload beta debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: dayline-beta-debug
          path: app/build/outputs/apk/beta/debug/app-beta-debug.apk
          if-no-files-found: error

  auto_beta_tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.beta_tag.outputs.tag }}
      publish: ${{ steps.beta_tag.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create beta tag automatically
        id: beta_tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          block = re.search(r'create\("beta"\)\s*\{(?P<body>.*?)\n\s*\}', text, re.DOTALL)
          if not block:
              raise SystemExit("Could not find beta flavor in app/build.gradle.kts")
          match = re.search(r'versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', block.group("body"))
          if not match:
              raise SystemExit("Could not read beta versionName")
          print(match.group(1))
          PY
          )"
          TAG="v${VERSION}.beta"
          NOTES_FILE="docs/releases/${TAG}.md"

          test -s "$NOTES_FILE" || {
            echo "Missing release notes: $NOTES_FILE"
            exit 1
          }

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already published."
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; release will be recovered from the existing tag."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Dayline $TAG"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG from $GITHUB_SHA."

  beta_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.auto_beta_tag.outputs.publish == 'true'
    needs: [ci, auto_beta_tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_beta_tag.outputs.tag }}

      - name: Verify Nothing SDK binary is not committed
        run: test ! -f app/libs/glyph-matrix-sdk-2.0.aar

      - name: Fetch official Nothing Glyph Matrix SDK
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar \
            -o app/libs/glyph-matrix-sdk-2.0.aar
          test -s app/libs/glyph-matrix-sdk-2.0.aar

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 / API 37 SDK
        run: sdkmanager --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Validate beta signing secrets
        env:
          KEYSTORE: ${{ secrets.DAYLINE_BETA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DAYLINE_BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYLINE_BETA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYLINE_BETA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore beta keystore
        env:
          KEYSTORE: ${{ secrets.DAYLINE_BETA_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dayline-beta.jks"

      - name: Verify beta keystore alias
        env:
          STORE_PASSWORD: ${{ secrets.DAYLINE_BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYLINE_BETA_KEY_ALIAS }}
        run: |
          if ! keytool -list \
            -keystore "$RUNNER_TEMP/dayline-beta.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Configured DAYLINE_BETA_KEY_ALIAS was not found in the beta keystore."
            echo "Update the alias secret to the alias used when this beta signing key was created."
            exit 1
          fi

      - name: Build signed beta APK
        env:
          DAYLINE_KEYSTORE_FILE: ${{ runner.temp }}/dayline-beta.jks
          DAYLINE_KEYSTORE_PASSWORD: ${{ secrets.DAYLINE_BETA_KEYSTORE_PASSWORD }}
          DAYLINE_KEY_ALIAS: ${{ secrets.DAYLINE_BETA_KEY_ALIAS }}
          DAYLINE_KEY_PASSWORD: ${{ secrets.DAYLINE_BETA_KEY_PASSWORD }}
        run: gradle :app:assembleBetaRelease --no-daemon --stacktrace

      - name: Verify beta APK version matches tag
        shell: bash
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          BADGING="$($AAPT dump badging app/build/outputs/apk/beta/release/app-beta-release.apk | head -n 1)"
          python3 - "${{ needs.auto_beta_tag.outputs.tag }}" "$BADGING" <<'PY'
          import re
          import sys

          tag = sys.argv[1].removeprefix("v")
          badging = sys.argv[2]
          match = re.search(r"versionCode='(\d+)'.*versionName='([^']+)'", badging)
          if not match:
              raise SystemExit("Could not read APK versionCode/versionName")

          version_code = int(match.group(1))
          version_name = match.group(2)
          if version_name != tag:
              raise SystemExit(f"Tag/APK versionName mismatch: tag={tag}, apk={version_name}")

          numbers = re.match(r"^(\d+)\.(\d+)\.(\d+)", tag)
          if not numbers:
              raise SystemExit(f"Unsupported beta tag format: {tag}")
          major, minor, patch = map(int, numbers.groups())
          expected_code = major * 1_000_000 + minor * 100 + patch
          if version_code != expected_code:
              raise SystemExit(f"Tag/APK versionCode mismatch: expected={expected_code}, apk={version_code}")

          print(f"Verified {version_name} / versionCode {version_code}")
          PY

      - name: Verify beta APK signature
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/beta/release/app-beta-release.apk

      - name: Prepare beta APK + checksum
        id: beta
        shell: bash
        run: |
          APK_NAME="dayline-${{ needs.auto_beta_tag.outputs.tag }}.apk"
          cp app/build/outputs/apk/beta/release/app-beta-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload beta artifact
        uses: actions/upload-artifact@v7
        with:
          name: dayline-beta-release
          path: |
            ${{ steps.beta.outputs.apk }}
            ${{ steps.beta.outputs.apk }}.sha256
          if-no-files-found: error

      - name: Validate beta release notes
        shell: bash
        run: |
          NOTES_FILE="docs/releases/${{ needs.auto_beta_tag.outputs.tag }}.md"
          test -s "$NOTES_FILE" || {
            echo "Missing concise release notes: $NOTES_FILE"
            echo "Every beta must ship Added / Changed / Fixed notes for the in-app updater."
            exit 1
          }
          grep -qi '^## Added' "$NOTES_FILE"
          grep -qi '^## Changed' "$NOTES_FILE"
          grep -qi '^## Fixed' "$NOTES_FILE"

      - name: Publish GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="docs/releases/${{ needs.auto_beta_tag.outputs.tag }}.md"
          gh release create "${{ needs.auto_beta_tag.outputs.tag }}" \
            "${{ steps.beta.outputs.apk }}" \
            "${{ steps.beta.outputs.apk }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dayline ${{ needs.auto_beta_tag.outputs.tag }}" \
            --prerelease \
            --notes-file "$NOTES_FILE"
