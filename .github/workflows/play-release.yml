name: Build Play Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static release validation
        run: python3 scripts/validate_release.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 / API 37 SDK
        run: |
          sdkmanager --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Validate signing secrets
        env:
          DAYLINE_KEYSTORE_BASE64: ${{ secrets.DAYLINE_KEYSTORE_BASE64 }}
          DAYLINE_KEYSTORE_PASSWORD: ${{ secrets.DAYLINE_KEYSTORE_PASSWORD }}
          DAYLINE_KEY_ALIAS: ${{ secrets.DAYLINE_KEY_ALIAS }}
          DAYLINE_KEY_PASSWORD: ${{ secrets.DAYLINE_KEY_PASSWORD }}
        run: |
          test -n "$DAYLINE_KEYSTORE_BASE64"
          test -n "$DAYLINE_KEYSTORE_PASSWORD"
          test -n "$DAYLINE_KEY_ALIAS"
          test -n "$DAYLINE_KEY_PASSWORD"

      - name: Restore upload keystore
        env:
          DAYLINE_KEYSTORE_BASE64: ${{ secrets.DAYLINE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DAYLINE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dayline-upload.jks"

      - name: Build signed release APK and AAB
        env:
          DAYLINE_KEYSTORE_FILE: ${{ runner.temp }}/dayline-upload.jks
          DAYLINE_KEYSTORE_PASSWORD: ${{ secrets.DAYLINE_KEYSTORE_PASSWORD }}
          DAYLINE_KEY_ALIAS: ${{ secrets.DAYLINE_KEY_ALIAS }}
          DAYLINE_KEY_PASSWORD: ${{ secrets.DAYLINE_KEY_PASSWORD }}
        run: |
          gradle :app:assemblePlayRelease :app:bundlePlayRelease --no-daemon --stacktrace

      - name: Verify signed artifacts exist
        run: |
          test -f app/build/outputs/apk/play/release/app-play-release.apk
          test -f app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Prepare artifacts
        run: |
          mkdir -p play-artifacts
          cp app/build/outputs/apk/play/release/app-play-release.apk play-artifacts/dayline-release.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab play-artifacts/dayline-release.aab

      - name: Upload Play-ready release
        uses: actions/upload-artifact@v4
        with:
          name: dayline-play-release
          path: play-artifacts/
          if-no-files-found: error
